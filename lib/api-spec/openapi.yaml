components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── Auth ──────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, username, name, role]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, manager, viewer]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [username, name, password, role]
      properties:
        username:
          type: string
        name:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, manager, viewer]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        password:
          type: ["string", "null"]
        role:
          type: string
          enum: [admin, manager, viewer]

    # ─── Dashboard ─────────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [totalUnits, occupiedUnits, vacantUnits, totalTenants, activeContracts, monthlyReceiptsILS, monthlyPaymentsILS, cashBalanceILS]
      properties:
        totalUnits:
          type: integer
        occupiedUnits:
          type: integer
        vacantUnits:
          type: integer
        totalTenants:
          type: integer
        activeContracts:
          type: integer
        expiringContractsSoon:
          type: integer
        monthlyReceiptsILS:
          type: number
        monthlyPaymentsILS:
          type: number
        cashBalanceILS:
          type: number
        totalBankBalanceILS:
          type: number
        pendingCheques:
          type: integer

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        entityId:
          type: ["integer", "null"]
        entityType:
          type: ["string", "null"]
        createdAt:
          type: string

    DashboardLatestReceipt:
      type: object
      required: [id, voucherNumber, date, payerName, amountILS, paymentMethod]
      properties:
        id:
          type: integer
        voucherNumber:
          type: string
        date:
          type: string
        payerName:
          type: string
        amountILS:
          type: number
        paymentMethod:
          type: string

    # ─── Units ─────────────────────────────────────────────────────────────────
    Unit:
      type: object
      required: [id, unitNumber, floor, type, area, status]
      properties:
        id:
          type: integer
        unitNumber:
          type: string
        floor:
          type: string
        type:
          type: string
          enum: [office, shop, warehouse, apartment, other]
        area:
          type: number
        status:
          type: string
          enum: [vacant, occupied, maintenance]
        description:
          type: ["string", "null"]
        createdAt:
          type: string

    UnitInput:
      type: object
