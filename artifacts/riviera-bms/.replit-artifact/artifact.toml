kind = "web"
previewPath = "/"
title = "Riviera Building Management"
version = "1.0.0"

[[services]]
localPort = 3000
name = "Riviera BMS"
paths = ["/"]

[services.env]
PORT = "3000"
BASE_PATH = "/"

[services.development]
run = "pnpm --filter @workspace/riviera-bms run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/riviera-bms", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
BASE_PATH = "/"
